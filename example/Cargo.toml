[package]
edition = "2021"
readme = "README.md"
name = "example"
version = "0.1.0"


[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"


embassy-stm32 = { version = "0.4.0", features = [
    "defmt",
    "stm32f103cb",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
] }
embassy-sync = { version = "0.7.1", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-usb = { version = "0.5.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }
embedded-hal = { version = "1.0.0" }
embedded-hal-v02 = { version = "0.2.7", package = "embedded-hal" }
embedded-hal-async = { version = "1.0" }
panic-semihosting = "0.6.0"

display-interface = "0.5.0"
display-interface-spi = "0.5.0"
# critical-section = "1.2.0"
# this lets you use `cargo fix`!


defmt = "1.0.1"
defmt-rtt = "1.0.0"
defmt-semihosting = "0.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-dma = "0.2.0"

embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
embassy-st7789v-driver = { path = "../" }
heapless = "0.9.1"

embedded-hal-bus = { version = "0.3.0", features = [
    "defmt-03",
    "async",
    "portable-atomic",
] }
ssd1306 = { version = "0.10.0", features = ["graphics", "async"] }

[[bin]]
path = "src/main.rs"
name = "example"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 'z'         # <-
overflow-checks = true  # <-

[profile.release]
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations
